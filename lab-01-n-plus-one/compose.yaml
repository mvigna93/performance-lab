services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: performance_lab
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - performance-lab-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d performance_lab"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  performance-lab-postgres:
